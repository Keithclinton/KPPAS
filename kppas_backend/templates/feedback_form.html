<!DOCTYPE html>
<html>
<head>
    <title>Public Feedback</title>
</head>
<body>
    <h2>Submit Your Feedback</h2>
    {% if message %}<p><b>{{ message }}</b></p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Submit">
    </form>
</body>
</html>
