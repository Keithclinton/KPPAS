<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}KPPAS{% endblock %}</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --border: rgba(11, 11, 11, 0.10);
    --grid: #e1e0d9;
    --link: #2a78d6;
    --good: #0ca30c;
    --warning-ink: #92620a;
    --warning: #fab219;
    --critical: #d03b3b;
    --good-bg: #e3f4e3;
    --warning-bg: #fdf1da;
    --critical-bg: #fae2e2;
    --empty-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface: #1a1a19;
      --page: #0d0d0d;
      --ink: #ffffff;
      --ink-secondary: #c3c2b7;
      --ink-muted: #898781;
      --border: rgba(255, 255, 255, 0.10);
      --grid: #2c2c2a;
      --link: #3987e5;
      --good: #0ca30c;
      --warning-ink: #fab219;
      --warning: #fab219;
      --critical: #e66767;
      --good-bg: rgba(12, 163, 12, 0.16);
      --warning-bg: rgba(250, 178, 25, 0.16);
      --critical-bg: rgba(208, 59, 59, 0.20);
      --empty-bg: rgba(255, 255, 255, 0.05);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    line-height: 1.45;
  }
  header.site {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header.site .brand {
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  header.site nav a {
    color: var(--ink-secondary);
    text-decoration: none;
    margin-left: 20px;
    font-size: 0.9rem;
  }
  header.site nav a:hover { color: var(--link); }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  p.subtitle { color: var(--ink-secondary); margin: 0 0 20px; font-size: 0.92rem; max-width: 62ch; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 20px;
  }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th {
    color: var(--ink-muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  a { color: var(--link); }
  .back-link { display: inline-block; margin-bottom: 14px; font-size: 0.9rem; text-decoration: none; }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .status-chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status-chip.status-green  { color: var(--good);       background: var(--good-bg); }
  .status-chip.status-green  .dot { background: var(--good); }
  .status-chip.status-amber  { color: var(--warning-ink); background: var(--warning-bg); }
  .status-chip.status-amber  .dot { background: var(--warning); }
  .status-chip.status-red    { color: var(--critical);   background: var(--critical-bg); }
  .status-chip.status-red    .dot { background: var(--critical); }

  .badge {
    font-size: 0.75em;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--empty-bg);
    color: var(--ink-secondary);
    white-space: nowrap;
  }
  .badge-unverified { background: var(--critical-bg); color: var(--critical); }
  .badge-provisional { background: var(--warning-bg); color: var(--warning-ink); }
  .badge-verified { background: var(--good-bg); color: var(--good); }

  form p { margin: 0 0 14px; display: flex; flex-direction: column; gap: 5px; }
  form label { font-size: 0.85rem; color: var(--ink-secondary); font-weight: 600; }
  form input, form select, form textarea {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--page);
    color: var(--ink);
    max-width: 420px;
  }
  form textarea { max-width: 100%; min-height: 90px; }
  form input[type="submit"] {
    max-width: max-content;
    background: var(--link);
    color: #fff;
    border: none;
    padding: 9px 18px;
    font-weight: 600;
    cursor: pointer;
  }
  form input[type="submit"]:hover { opacity: 0.9; }

  .message-success {
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--good-bg);
    color: var(--good);
    font-weight: 600;
    margin-bottom: 16px;
  }

  {% block extra_style %}{% endblock %}
</style>
</head>
<body>
<header class="site">
  <a class="brand" href="{% url 'promise_registry' %}">KPPAS &middot; Promise Registry</a>
  <nav>
    <a href="{% url 'promise_registry' %}">Promises</a>
    <a href="{% url 'feedback' %}">Give feedback</a>
    <a href="{% url 'data_access' %}">Data access</a>
    <a href="/admin/">Admin</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
